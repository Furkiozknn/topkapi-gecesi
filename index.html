<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<title>Topkapı Gecesi</title>
<meta name="description" content="A 3D stealth game at night in an Ottoman palace: put the Spoon-maker's Diamond back before dawn. Claude Game Arena, built by Claude Opus 5.5.">
<style>
:root{
  --bg:#0b1226; --ink:#f4ecda; --ink2:#b9c3dc; --gold:#C9A227; --gold2:#e8c75c; --blue:#7ea6ea; --red:#e2554a; --green:#7cc46a; --amber:#f2a33a;
  --glass:rgba(14,22,50,.64); --line:rgba(201,162,39,.24);
  --sa-t:env(safe-area-inset-top,0px); --sa-b:env(safe-area-inset-bottom,0px); --sa-l:env(safe-area-inset-left,0px); --sa-r:env(safe-area-inset-right,0px);
}
*{box-sizing:border-box}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);
  font-family:system-ui,-apple-system,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-tap-highlight-color:transparent;
  touch-action:none;user-select:none;-webkit-user-select:none}
#c{position:fixed;inset:0;width:100%;height:100%;display:block;outline:none}
[hidden]{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--gold2);outline-offset:2px}
.glass{background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--line);border-radius:16px;box-shadow:0 10px 32px rgba(0,0,0,.4)}
.serif{font-family:Georgia,"Times New Roman",serif}
svg{display:block}
b,.num{font-variant-numeric:tabular-nums}

/* top bar */
.topbar{position:fixed;top:calc(8px + var(--sa-t));left:calc(8px + var(--sa-l));right:calc(8px + var(--sa-r));min-height:56px;display:flex;align-items:center;gap:8px;padding:4px 8px;z-index:20}
.brand{display:flex;align-items:center;gap:8px;font-weight:700;color:var(--gold2);white-space:nowrap}
.brand svg{width:36px;height:36px}
.brand span{font-size:19px;letter-spacing:.02em}
.stats{flex:1;display:flex;justify-content:center;align-items:center;gap:18px;flex-wrap:wrap;font-size:14px;color:var(--ink2);min-width:0}
.stats b{color:var(--ink);font-weight:700}
.st{display:inline-flex;align-items:center;gap:6px;white-space:nowrap}
.st svg{width:20px;height:20px;color:var(--gold2)}
.st b.warn{color:var(--red)}
.acts{display:flex;gap:2px}
.ibtn{width:44px;height:44px;border-radius:12px;border:1px solid transparent;background:transparent;display:inline-flex;align-items:center;justify-content:center;color:var(--ink);font-weight:700;font-size:13px}
.ibtn:hover{background:rgba(255,255,255,.08);border-color:var(--line)}
.ibtn svg{width:24px;height:24px}
.stars{display:inline-flex;gap:3px;vertical-align:middle}
.stars svg{width:20px;height:20px}
.stars svg,.bigstars svg,.mstars svg{fill:transparent;stroke:rgba(255,255,255,.45);stroke-width:1.5}
.stars svg.on,.bigstars svg.on,.mstars svg.on{fill:var(--gold2);stroke:var(--gold2)}
.stars svg.lost{stroke:rgba(226,85,74,.7)}
@media (max-width:760px){
  .topbar{flex-wrap:wrap;padding:4px 6px}
  .brand span{display:none}
  .stats{gap:12px;font-size:13px;order:3;flex-basis:100%;justify-content:space-around;padding-bottom:4px}
  .acts{margin-left:auto}
}

/* objectives */
.objs{position:fixed;right:calc(8px + var(--sa-r));top:calc(74px + var(--sa-t));width:260px;padding:8px 10px;z-index:18;font-size:13px}
.objs h4,.vis h4{margin:0 0 4px;font-size:11px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink2)}
.orow{display:flex;align-items:center;gap:8px;padding:4px 2px;line-height:1.25}
.orow svg{width:20px;height:20px;flex:0 0 20px;color:var(--ink2)}
.orow.done{opacity:.6}.orow.done svg{color:var(--green)}
.orow.act{color:var(--ink)}.orow.act svg{color:var(--gold2)}
.orow.opt{border-top:1px solid rgba(255,255,255,.08);margin-top:2px;padding-top:6px;color:var(--ink2)}
.orow.fail{opacity:.55}.orow.fail svg{color:var(--red)}
@media (max-width:760px){.objs{top:calc(112px + var(--sa-t));width:min(60vw,240px);font-size:12px;padding:6px 8px}.objs h4{display:none}.orow:not(.act){display:none}}
@media (max-height:520px){.objs{top:calc(70px + var(--sa-t));width:220px;font-size:12px;padding:6px 8px}.objs h4{display:none}.orow:not(.act){display:none}}

/* visibility meter */
.vis{position:fixed;left:calc(8px + var(--sa-l));bottom:calc(8px + var(--sa-b));padding:8px 12px;z-index:19;width:236px}
.vrow{display:flex;align-items:center;gap:8px}
.vrow svg{width:26px;height:26px;flex:0 0 26px;color:var(--ink2)}
.vbar{flex:1;height:12px;border-radius:6px;background:linear-gradient(90deg,#1b2a55,#3f5d9c 35%,#d9a24a 70%,#ffd27a);position:relative;overflow:hidden}
.vbar i{position:absolute;top:0;bottom:0;right:0;background:rgba(8,12,28,.82);transition:left .08s linear}
.vbar em{position:absolute;top:-3px;bottom:-3px;width:3px;background:#fff;border-radius:2px;margin-left:-1px;box-shadow:0 0 6px #fff}
.vlbl{font-size:12.5px;color:var(--ink2);margin-top:4px;display:flex;justify-content:space-between;gap:8px}
.vlbl b{color:var(--ink)}
.tools{display:flex;gap:10px;margin-top:6px;font-size:12.5px;color:var(--ink2);align-items:center}
.tools span{display:inline-flex;align-items:center;gap:4px}
.tools svg{width:18px;height:18px;color:var(--gold2)}
.dashbar{width:40px;height:6px;border-radius:3px;background:rgba(255,255,255,.14);overflow:hidden;display:inline-block}
.dashbar i{display:block;height:100%;background:var(--gold2)}
.vis.lit .vrow svg{color:var(--amber)}
.vis.hid .vrow svg{color:var(--green)}
@media (max-width:760px){.vis{width:186px;padding:6px 8px;bottom:calc(150px + var(--sa-b))}.tools{gap:6px}}
@media (max-height:520px) and (pointer:coarse){.vis{bottom:calc(8px + var(--sa-b));left:calc(170px + var(--sa-l));width:180px}}

/* interaction prompt, note card, toasts */
.prompt{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(24px + var(--sa-b));padding:8px 16px;font-size:15px;font-weight:600;z-index:19;display:flex;align-items:center;gap:10px;pointer-events:none}
.prompt kbd{font:700 13px ui-monospace,Consolas,monospace;border:1px solid var(--gold);border-radius:6px;padding:2px 8px;color:var(--gold2)}
@media (pointer:coarse){.prompt kbd{display:none}.prompt{bottom:calc(190px + var(--sa-b))}}
.note{position:fixed;left:50%;bottom:calc(84px + var(--sa-b));transform:translateX(-50%) rotate(-1deg);width:min(92vw,440px);padding:14px 18px 12px;z-index:24;pointer-events:none;
  background:linear-gradient(180deg,#f3e3bf,#e2c993);color:#3a2614;border-radius:6px;box-shadow:0 14px 34px rgba(0,0,0,.5);border:1px solid #b8913f;animation:nin .35s ease-out;font-family:Georgia,serif}
.note h5{margin:0 0 4px;font-size:13px;letter-spacing:.06em;text-transform:uppercase;color:#7a4a1a}
.note p{margin:0;font-size:16px;line-height:1.4}
@keyframes nin{from{opacity:0;transform:translateX(-50%) translateY(16px) rotate(2deg)}}
@media (pointer:coarse){.note{bottom:calc(230px + var(--sa-b))}}
.toasts{position:fixed;top:calc(76px + var(--sa-t));left:50%;transform:translateX(-50%);display:flex;flex-direction:column;gap:6px;align-items:center;z-index:25;pointer-events:none;width:max-content;max-width:min(92vw,520px)}
@media (max-width:760px){.toasts{top:calc(118px + var(--sa-t));left:calc(8px + var(--sa-l));transform:none;align-items:flex-start;max-width:calc(100vw - 250px)}}
.toast{padding:8px 16px;border-radius:12px;font-weight:600;font-size:14.5px;animation:tin .25s ease-out;border-left:4px solid var(--gold);text-align:center}
.toast.good{border-left-color:var(--green)} .toast.bad{border-left-color:var(--red)}
.toast.out{opacity:0;transform:translateY(-6px);transition:all .3s}
@keyframes tin{from{opacity:0;transform:translateY(-8px)}to{opacity:1;transform:none}}
@media (max-width:760px){.toast{font-size:13px;padding:6px 10px;text-align:left}}

/* touch controls */
.touch{position:fixed;inset:auto 0 0 0;height:0;z-index:21}
.stick{position:fixed;left:calc(18px + var(--sa-l));bottom:calc(18px + var(--sa-b));width:132px;height:132px;border-radius:50%;background:rgba(14,22,50,.45);border:1px solid var(--line);touch-action:none}
.stick i{position:absolute;left:50%;top:50%;width:58px;height:58px;margin:-29px 0 0 -29px;border-radius:50%;background:rgba(201,162,39,.55);border:2px solid var(--gold2)}
.tbtns{position:fixed;right:calc(14px + var(--sa-r));bottom:calc(16px + var(--sa-b));display:grid;grid-template-columns:repeat(3,58px);grid-template-rows:repeat(2,58px);gap:8px}
.tb{width:58px;height:58px;border-radius:50%;border:1px solid var(--line);background:rgba(14,22,50,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:10px;font-weight:700;color:var(--ink);touch-action:none;padding:0}
.tb svg{width:24px;height:24px}
.tb.on{background:rgba(201,162,39,.45);border-color:var(--gold2)}
.tb.big{background:rgba(201,162,39,.35);border-color:var(--gold2)}

/* overlays */
.overlay{position:fixed;inset:0;display:flex;align-items:center;justify-content:center;background:rgba(6,10,26,.45);backdrop-filter:blur(7px);-webkit-backdrop-filter:blur(7px);z-index:30;padding:12px;overflow:auto}
.overlay.clear{background:rgba(6,10,26,.15);backdrop-filter:none;-webkit-backdrop-filter:none}
.panel{padding:22px 24px;width:min(94vw,470px);max-height:calc(100vh - 24px);overflow:auto}
.panel.wide{width:min(96vw,940px)}
.panel h2{margin:0 0 12px;font-size:24px;color:var(--gold2);font-family:Georgia,serif}
.col{display:flex;flex-direction:column;gap:10px}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.btn{min-height:46px;padding:0 18px;border-radius:12px;border:1px solid var(--line);background:rgba(255,255,255,.08);color:var(--ink);font-weight:700;font-size:16px;display:inline-flex;align-items:center;justify-content:center;gap:8px}
.btn:hover{background:rgba(255,255,255,.14)}
.btn.primary{background:linear-gradient(180deg,#d8b23a,#b38a17);border-color:rgba(255,226,140,.6);color:#1c1405}
.btn.primary:hover{background:linear-gradient(180deg,#e6c24c,#c49a22)}
.btn:disabled{opacity:.45;cursor:default}
.btn.w{width:100%}
.btn svg{width:20px;height:20px}
label.sl{display:flex;align-items:center;gap:10px;font-size:14px;color:var(--ink2)}
label.sl span{width:96px}
input[type=range]{flex:1;accent-color:var(--gold);height:44px;margin:0}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;min-width:64px;padding:0 14px;border:0;background:transparent;font-weight:600}
.seg button.on{background:var(--gold);color:#1c1405}
.lbl{width:96px;font-size:14px;color:var(--ink2)}
.footer{margin-top:14px;font-size:12px;color:var(--ink2);text-align:center}
.footer a{color:var(--gold2);text-decoration:none}

/* title */
.title{text-align:center;width:min(94vw,520px)}
.title .logo{width:132px;height:132px;margin:0 auto 4px}
.title h1{margin:0;font-size:48px;color:var(--gold2);letter-spacing:.02em;line-height:1.05;font-family:Georgia,serif;text-shadow:0 2px 18px rgba(201,162,39,.35)}
.title .sub{margin:6px 0 10px;color:var(--ink);font-size:15.5px}
.title .how{font-size:13px;color:var(--ink2);margin:0 0 14px;line-height:1.5}
.title .best{font-size:14px;margin:12px 0 0;color:var(--ink)}
#loadmsg{color:var(--ink2);font-size:14px;margin:6px 0;min-height:18px}
@media (max-height:640px){.title .logo{width:84px;height:84px}.title h1{font-size:36px}.title .how{display:none}}

/* palace map */
.mapwrap{display:grid;grid-template-columns:1.3fr 1fr;gap:16px}
@media (max-width:780px){.mapwrap{grid-template-columns:1fr}}
.pmap{position:relative;border-radius:14px;overflow:hidden;border:1px solid var(--line);background:#0f1a3a}
.pmap svg{width:100%;height:auto}
.mnode{cursor:pointer}
.mnode circle.c{fill:#1a2650;stroke:var(--gold);stroke-width:2}
.mnode.done circle.c{fill:#2e3e1f;stroke:var(--green)}
.mnode.sel circle.c{fill:var(--gold);stroke:#fff6d0;stroke-width:3}
.mnode.sel text{fill:#1c1405}
.mnode.lock{opacity:.4;cursor:default}
.mnode text{fill:var(--ink);font:700 15px system-ui,sans-serif;text-anchor:middle;dominant-baseline:central;pointer-events:none}
.mnode:focus-visible circle.c{stroke:#fff;stroke-width:4}
.brief h3{margin:0;font-size:22px;font-family:Georgia,serif;color:var(--ink)}
.brief .part{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--gold2)}
.brief p{font-size:14px;line-height:1.5;color:var(--ink2);margin:8px 0}
.brief ul{margin:0 0 10px;padding:0;list-style:none;font-size:13.5px}
.brief li{display:flex;gap:8px;align-items:center;padding:3px 0}
.brief li svg{width:20px;height:20px;flex:0 0 20px;color:var(--gold2)}
.mstars{display:inline-flex;gap:2px}
.mstars svg{width:16px;height:16px}
.mlist{display:grid;grid-template-columns:repeat(9,1fr);gap:4px;margin-top:8px}
.mlist button{min-height:44px;border-radius:10px;border:1px solid var(--line);background:rgba(255,255,255,.05);font-weight:700;padding:0}
.mlist button.sel{background:var(--gold);color:#1c1405}
.mlist button:disabled{opacity:.35}

/* result + end */
.sheet{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(12px + var(--sa-b));width:min(96vw,580px);z-index:30}
.sheet .panel{width:100%;padding:16px 18px}
.rhead{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap}
.rhead h2{margin:0;font-size:24px}
.bigstars{display:flex;gap:6px}
.bigstars svg{width:34px;height:34px}
.rsub{font-size:13.5px;color:var(--ink2);margin:4px 0 8px}
.kv{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:10px 0}
.kv div{padding:8px;border-radius:12px;background:rgba(255,255,255,.06);text-align:center}
.kv b{display:block;font-size:20px;color:var(--gold2)}
.kv span{font-size:11.5px;color:var(--ink2)}
.slist{font-size:13.5px;color:var(--ink2);display:flex;flex-direction:column;gap:4px;margin:4px 0 10px}
.slist div{display:flex;gap:8px;align-items:center}
.slist svg{width:18px;height:18px;flex:0 0 18px}
.slist .y{color:var(--ink)} .slist .y svg{color:var(--green)} .slist .n svg{color:var(--red)}
.rec{color:var(--green);font-weight:700;text-align:center;margin:4px 0}
@media (max-width:760px){.kv{grid-template-columns:1fr 1fr}}
.endbox{position:fixed;left:50%;bottom:calc(16px + var(--sa-b));transform:translateX(-50%);width:min(96vw,620px);z-index:31;text-align:center}
.endbox h2{font-size:34px;margin:0 0 6px}
.endbox p{color:var(--ink);line-height:1.5;margin:6px 0 12px;font-size:15px}
.fade{position:fixed;inset:0;background:#05070f;opacity:0;pointer-events:none;z-index:28;transition:opacity .5s}
.fade.on{opacity:.85}
.redflash{position:fixed;inset:0;pointer-events:none;z-index:17;box-shadow:inset 0 0 120px 30px rgba(226,60,50,0);transition:box-shadow .25s}
.redflash.on{box-shadow:inset 0 0 140px 40px rgba(226,60,50,.45)}
.redflash.sus{box-shadow:inset 0 0 120px 26px rgba(242,180,40,.28)}

#dbg{position:fixed;left:8px;top:calc(70px + var(--sa-t));font:12px/1.4 ui-monospace,Consolas,monospace;color:#9f9;background:rgba(0,0,0,.65);padding:6px 8px;white-space:pre;pointer-events:none;z-index:60;border-radius:6px;max-width:92vw;overflow:hidden}
#dbg .err{color:#f66}
</style>
<script type="importmap">

</script>

<canvas id="c" tabindex="0" aria-label="Topkapı Gecesi"></canvas>

<svg width="0" height="0" style="position:absolute" aria-hidden="true">
  <defs>
    <linearGradient id="g-night" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#0a1230"/><stop offset=".7" stop-color="#1f3466"/><stop offset="1" stop-color="#3a4f86"/></linearGradient>
    <linearGradient id="g-gold" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#fff0a8"/><stop offset=".5" stop-color="#C9A227"/><stop offset="1" stop-color="#8a6a10"/></linearGradient>
    <symbol id="i-logo" viewBox="0 0 64 64">
      <circle cx="32" cy="32" r="30" fill="url(#g-night)" stroke="#C9A227" stroke-width="2"/>
      <circle cx="46" cy="17" r="7" fill="#f6efd2"/><circle cx="49" cy="15" r="6" fill="#16224a"/>
      <circle cx="14" cy="14" r=".9" fill="#fff"/><circle cx="22" cy="9" r=".7" fill="#fff"/><circle cx="34" cy="12" r=".6" fill="#fff"/>

      <path d="M4 46 L60 46 L58 52 Q32 60 6 52 Z" fill="#203a6e"/>
      <path d="M32 38 L38 44 L32 54 L26 44 Z" fill="url(#g-gold)" stroke="#fff3c0" stroke-width=".8"/>
      <path d="M26 44 L38 44 M32 38 L30 44 L32 54 L34 44 Z" fill="none" stroke="#fff3c0" stroke-width=".5" opacity=".8"/>
    </symbol>
    <symbol id="i-star" viewBox="0 0 24 24"><path d="M12 2.6l2.9 6 6.5.8-4.8 4.5 1.2 6.5L12 17.2 6.2 20.4l1.2-6.5L2.6 9.4l6.5-.8z"/></symbol>
    <symbol id="i-moon" viewBox="0 0 24 24"><path d="M15.5 3.2A8.8 8.8 0 1 0 20.8 15 7 7 0 0 1 15.5 3.2z" fill="currentColor"/></symbol>
    <symbol id="i-pause" viewBox="0 0 24 24"><rect x="6" y="4.5" width="4" height="15" rx="1.2" fill="currentColor"/><rect x="14" y="4.5" width="4" height="15" rx="1.2" fill="currentColor"/></symbol>
    <symbol id="i-play" viewBox="0 0 24 24"><path d="M7 4.5v15l12.5-7.5z" fill="currentColor"/></symbol>
    <symbol id="i-sound" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z" fill="currentColor"/><path d="M15.5 8.5a5 5 0 0 1 0 7M18 6a8.5 8.5 0 0 1 0 12" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round"/></symbol>
    <symbol id="i-mute" viewBox="0 0 24 24"><path d="M4 9.5h3.5L12.5 5v14l-5-4.5H4z" fill="currentColor"/><path d="M16 9l5 6M21 9l-5 6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></symbol>
    <symbol id="i-gear" viewBox="0 0 24 24"><path d="M12 8.5a3.5 3.5 0 1 0 0 7 3.5 3.5 0 0 0 0-7zm8.4 4.6l1.6 1.2-1.8 3.2-1.9-.6a7.5 7.5 0 0 1-1.7 1l-.3 2h-3.6l-.4-2a7.5 7.5 0 0 1-1.7-1l-1.9.6-1.8-3.2 1.6-1.2a7.5 7.5 0 0 1 0-2l-1.6-1.3 1.8-3.1 1.9.6a7.5 7.5 0 0 1 1.7-1l.4-2h3.6l.3 2a7.5 7.5 0 0 1 1.7 1l1.9-.6 1.8 3.1-1.6 1.3a7.5 7.5 0 0 1 0 2z" fill="currentColor"/></symbol>

// Per-frame visuals
// ---------------------------------------------------------------------------
const tmpC = new THREE.Color(), STATECOL = { patrol: [0.55, 0.85, 1], return: [0.55, 0.85, 1], sus: [1, 0.82, 0.25], search: [1, 0.66, 0.2], alert: [1, 0.25, 0.2] };

function lanternWarm(S, x, z) { const i = C.cellAt(S.L, x, z); return i < 0 ? 0 : Math.max(0, C.lightAt(S, x, z) - S.L.moon[i]); }
function render(dt) {

    const P = S.p, pm = WORLD.player;

// ---------------------------------------------------------------------------
// Bot driver for ?auto: menus are clicked through, missions are played by CORE.botInput
// ---------------------------------------------------------------------------
const BOTLOG = [];
const AUTO = { t: 1, done: false, tries: 0 };
function autoUpdate(dt) {
  if (AUTO.done) return;
  AUTO.t -= dt; if (AUTO.t > 0) return;
  switch (G.screen) {
    case 'title': AUTO.t = 0.8; openMap(); break;
    case 'map': { AUTO.t = 0.6; const i = BOTLOG.filter(b => b.ok).length; if (i >= NM) { openEnd(); break; } G.sel = i; buildMap(); startMission(i); break; }
    case 'play': AUTO.t = 0.5; break;
    case 'result': {
      AUTO.t = 0.8; const R = G.S.result;
      BOTLOG.push({ m: G.idx + 1, ok: R.ok, t: +R.time.toFixed(1), stars: R.stars.map(Number).join(''), alerts: R.alerts, caught: R.caught, plans: G.bot ? G.bot.plans : 0 });

// ---------------------------------------------------------------------------
// Update loop, debug, state export
// ---------------------------------------------------------------------------
function update(dt) {
  G.time += dt;
  if (FLAG.auto && G.ready) autoUpdate(dt);
  const S = G.S; if (!S) return;
  if (G.screen === 'play' && !G.paused) {

    if (S.over) { G.resultT += dt; if (G.resultT > 1.4) showResult(); }
  } else if (G.screen === 'title' || G.screen === 'map' || G.screen === 'end') {

    G.acc += dt; let n = 0; const I0 = { mx: 0, mz: 0 };
    while (G.acc >= C.DT && n < 4) { S.respawnT = 1; C.step(S, I0); S.events.length = 0; G.acc -= C.DT; n++; }
    if (S.t > 200) { S.t = 0; }
  }
}

    player: S ? { x: +S.p.x.toFixed(2), z: +S.p.z.toFixed(2), vis: +S.p.vis.toFixed(2), gait: S.p.gait, hidden: S.p.hidden >= 0, pebbles: S.pebbles } : null,
    guards: S ? S.guards.map(g => ({ type: g.type, state: g.state, sus: +g.sus.toFixed(2) })) : [], clues: S ? S.clues + '/' + S.need : '',

    (e.length ? `\n<span class="err">${e.slice(-4).map(s => String(s).replace(/</g, '&lt;')).join('\n')}</span>` : '\nerrors 0');

// boot

applySky('night', 0);
setTitleScene();
if (SET.quality === 'low') setQuality('low');
applyTexts(); auVolumes();
hideAll(); show('title', true);

  if (FLAG.mission >= 1 && FLAG.mission <= NM && !FLAG.auto) startMission(FLAG.mission - 1);

setTimeout(ready, 6000);
window.__loaded = true;
let last = performance.now();
function frame(now) {
  requestAnimationFrame(frame);
  const dt = Math.min(0.05, (now - last) / 1000); last = now;
  if (G.hidden) return;
  update(dt);
  render(dt);
  updateHUD(dt);
  updateAudio(dt);
  DBG.frames++; DBG.ft += dt; if (DBG.ft >= 0.5) { DBG.fps = Math.round(DBG.frames / DBG.ft); DBG.frames = 0; DBG.ft = 0; exportState(); if (FLAG.debug) debugText(); }
}
